# Tier 1 contract gate (docs/philosophy.md §4): every push and PR, budget 10 minutes including Tier 0.
name: tier1

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tier1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
