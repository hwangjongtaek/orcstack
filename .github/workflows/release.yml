# Release (M5-2): when a VERSION change reaches main, tag v<VERSION> and publish a GitHub Release whose notes are that
# version's CHANGELOG section. Releases are prepared in a PR with `node tools/release.mjs prepare --version <x.y.z>`.
# An existing tag is never moved.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          TAG="v$VERSION"
          if [ "$VERSION" = "0.0.0" ]; then echo "VERSION is 0.0.0; nothing to release."; exit 0; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node tools/release.mjs notes --version "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "orcstack $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "Released $TAG at $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
