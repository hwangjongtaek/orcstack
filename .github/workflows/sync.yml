# Weekly upstream sync (M5-1, SSOT §4 F2): sync src/ to upstream pstack and open a PR from a sync/ branch.
# The decisions live in tools/sync-pr.mjs. This job never writes to main; a person reviews and merges the PR.
# PRs opened with the default GITHUB_TOKEN do not start tier0/tier1. Set the ORCSTACK_SYNC_TOKEN secret
# (contents and pull requests: write on this repository) so they do; without it the PR body says how to start them.
name: sync

on:
  schedule:
    - cron: "0 0 * * 1" # Mondays 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.ORCSTACK_SYNC_TOKEN || github.token }}
      HAS_SYNC_TOKEN: ${{ secrets.ORCSTACK_SYNC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ORCSTACK_SYNC_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: clone upstream
        run: git clone --quiet --filter=blob:none "$(node -p 'require("./sync/upstream.json").remote')" "$RUNNER_TEMP/upstream"
      - name: sync
        id: sync
        run: |
          node tools/sync-pr.mjs --upstream "$RUNNER_TEMP/upstream" --out "$RUNNER_TEMP/sync" > "$RUNNER_TEMP/sync.json"
          cat "$RUNNER_TEMP/sync.json"
          for key in action ok to branch title draft body; do
            echo "$key=$(node -p "require(process.env.RUNNER_TEMP + '/sync.json').$key ?? ''")" >> "$GITHUB_OUTPUT"
          done
      - name: skip a branch that already exists
        id: branch
        if: steps.sync.outputs.action == 'open'
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "\`$BRANCH\` already exists. A person may be resolving it; nothing was pushed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: check and finish the PR body
        if: steps.sync.outputs.action == 'open' && steps.branch.outputs.exists == 'false'
        env:
          BODY: ${{ steps.sync.outputs.body }}
        run: |
          if npm run check > "$RUNNER_TEMP/check.log" 2>&1; then status="통과"; else status="실패"; fi
          {
            echo ""
            echo "## sync job의 \`npm run check\`: $status"
            echo ""
            echo "<details><summary>마지막 40줄</summary>"
            echo ""
            echo '```'
            tail -n 40 "$RUNNER_TEMP/check.log"
            echo '```'
            echo ""
            echo "</details>"
            # shellcheck disable=SC2016 # jq string interpolation, not shell
            open=$(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("sync/pstack-")) | "- #\(.number) `\(.headRefName)`"')
            if [ -n "$open" ]; then
              echo ""
              echo "## 열려 있는 이전 sync PR"
              echo ""
              echo "이 PR이 더 새 upstream을 담는다. 이전 PR은 닫거나, 진행 중인 해결을 이 브랜치로 옮긴다."
              echo ""
              echo "$open"
            fi
            if [ "$HAS_SYNC_TOKEN" != "true" ]; then
              echo ""
              echo "> 이 PR은 기본 \`GITHUB_TOKEN\`으로 열려 tier0·tier1이 자동으로 돌지 않는다. PR을 닫았다 다시 열거나 브랜치에 커밋을 push하면 돈다."
            fi
          } >> "$BODY"
          cat "$BODY" >> "$GITHUB_STEP_SUMMARY"
      - name: open the PR
        if: steps.sync.outputs.action == 'open' && steps.branch.outputs.exists == 'false'
        env:
          BRANCH: ${{ steps.sync.outputs.branch }}
          TITLE: ${{ steps.sync.outputs.title }}
          TO: ${{ steps.sync.outputs.to }}
          BODY: ${{ steps.sync.outputs.body }}
          DRAFT: ${{ steps.sync.outputs.draft }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$BRANCH"
          git add -A src dist sync
          git commit -q -m "$TITLE" -m "upstream cursor/plugins $TO"
          git push --quiet origin "HEAD:refs/heads/$BRANCH"
          if [ "$DRAFT" = "true" ]; then
            # Draft PRs are not available on every plan; fall back to a ready PR whose body lists the conflicts.
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY" --draft \
              || gh pr create --base main --head "$BRANCH" --title "$TITLE (충돌 해결 필요)" --body-file "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY"
          fi
